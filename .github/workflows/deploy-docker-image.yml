name: Build and Deploy docker image
on:
  push:
    branches:
      - dev

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Get lowercase repo name
        id: repo_name
        uses: ASzc/change-string-case-action@v6
        with:
          string: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker build environment
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.repo_name.outputs.lowercase }}:dev
            ${{ steps.repo_name.outputs.lowercase }}:${{ steps.sha.outputs.SHORT_SHA }}

  trigger-deploy-infra:
    runs-on: ubuntu-latest
    needs:
      - build-and-push-docker
    steps:
      - name: Dispatch event
        run: gh api /repos/snail-official/nailian-iac/dispatches -f event_type='cd-backend' -f 'client_payload[commit_hash]=${{ needs.build-and-push-docker.SHORT_SHA }}'
        env:
          GH_TOKEN: ${{ secrets.GH_TRIGGER_TOKEN }}
