plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'art.snail.naillian'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

if (System.getenv().getOrDefault("_BUILD_CONTEXT", "").equalsIgnoreCase("docker")) {
    bootJar {
        setArchiveFileName("boot.jar")
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

static String boot(String dependency) {
    return "org.springframework.boot:spring-boot-$dependency"
}

dependencies {
    /* Spring Essentials */
    implementation boot('starter-oauth2-client')
    implementation boot('starter-security')
    implementation boot('starter-webflux')
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'

    /* Database */
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    implementation 'org.mariadb:r2dbc-mariadb:1.1.3'
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.1.4'

    /* Lombok */
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    /* Tests */
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation boot('starter-test')
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'

    /* jwt */
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    /* redis */
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    /* jackson */
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

}

tasks.named('test') {
    useJUnitPlatform()
    enabled = false
}
