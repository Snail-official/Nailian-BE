plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'art.snail.naillian'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

static String boot(String dependency) {
    return "org.springframework.boot:spring-boot-$dependency"
}

dependencies {
    /* Spring Essentials */
    implementation boot('starter-oauth2-client')
    implementation boot('starter-security')
    implementation boot('starter-webflux')

    /* Database */
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    /* Lombok */
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    /* Tests */
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation boot('starter-test')
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
    useJUnitPlatform()
    enabled = false
}
